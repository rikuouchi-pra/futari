:root[data-theme="dark"]{ --future:#6CCFC9; --talk:#A3AAF0; --habit:#A6D46E; --reflect:#A9BCD6; --who-h:#86B7E8; --who-w:#EE93B4; --who-b:#B5CF7A; --s-in:#9AA3F0; --s-ake:#BBAEE0; --s-off:#6FD39A; --s-early:#F0AA5E; --s-day:#7FB9E6; --s-on:#10151A; }

body{--accent:var(--task)}

/* timetable */
.tt{position:relative;background:var(--surface);border-radius:14px;overflow:hidden;touch-action:pan-y;cursor:copy}

.tt-ck svg{width:12px;height:12px;stroke:var(--bc);opacity:.35}.tt-ck:active svg{opacity:1}

.tt{overflow:visible}.tt-h:first-child{border-top-left-radius:14px;border-top-right-radius:14px}

/* ================= スタイル（クラシック／モダン／グラス／ダイナミック）と全体の操作感 ================= */
/* 共通：押した手応え・フォーカス・なめらかな色の変化 */
.opt,.chip,.btn,.hbtn,.pill,.rtab,.rhome,.seg button,.lsw button,.stile,.hl,.hlist button,.icon-btn,.tt-bar button{transition:transform .12s ease,background-color .18s,color .18s,box-shadow .18s}
.opt:active,.chip:active,.btn:active,.hbtn:active,.pill:active,.rtab:active,.rhome:active,.seg button:active,.lsw button:active,.stile:active,.hl:active,.icon-btn:active,.tt-bar button:active{transform:scale(.95)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.opt{min-height:40px}
.onb-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}.onb-names label{display:flex;flex-direction:column;gap:4px;min-width:0}.onb-names input{width:100%;box-sizing:border-box;min-width:0}
/* スタイル選択タイル */
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--ground);border-radius:16px;padding:10px;cursor:pointer;color:var(--ink)}
.stile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.stile b{font-size:14px}.stile small{font-size:11px;color:var(--muted);line-height:1.35}
.stpv{position:relative;width:100%;height:46px;border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:4px}
.stpv i{position:absolute;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stpv i:nth-child(1){left:8px;top:8px;width:45%;height:12px}.stpv i:nth-child(2){left:8px;top:26px;width:70%;height:12px}.stpv i:nth-child(3){right:8px;top:8px;width:14px;height:30px;border-radius:7px}
.st-classic .stpv{background:var(--ground)}.st-classic .stpv i{border-radius:4px;box-shadow:none;border:1px solid var(--line)}
.st-modern .stpv{background:linear-gradient(180deg,var(--ground),color-mix(in srgb,var(--accent) 6%,var(--ground)))}.st-modern .stpv i{border-radius:9px;box-shadow:0 4px 10px rgba(0,0,0,.10)}
.st-glass .stpv,.st-dynamic .stpv{background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 60%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--diary) 55%,transparent),transparent 60%),var(--ground)}
.st-glass .stpv i,.st-dynamic .stpv i{background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid color-mix(in srgb,#fff 40%,transparent)}
.st-dynamic .stpv{background-size:160% 160%;animation:stpv 5s ease-in-out infinite alternate}
@keyframes stpv{to{background-position:100% 100%}}
/* 背景のにじみ（グラス／ダイナミック） */
.fx-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;display:none}
.fx-bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.38}
.fx-bg i:nth-child(1){left:-25vmax;top:-20vmax;background:var(--accent)}
.fx-bg i:nth-child(2){right:-30vmax;top:20vh;background:var(--diary)}
.fx-bg i:nth-child(3){left:-10vmax;bottom:-35vmax;background:var(--cal)}
:root[data-style="glass"] .fx-bg,:root[data-style="dynamic"] .fx-bg{display:block}
:root[data-style="dynamic"] .fx-bg i:nth-child(1){animation:blob1 22s ease-in-out infinite alternate}
:root[data-style="dynamic"] .fx-bg i:nth-child(2){animation:blob2 26s ease-in-out infinite alternate}
:root[data-style="dynamic"] .fx-bg i:nth-child(3){animation:blob3 30s ease-in-out infinite alternate}
@keyframes blob1{to{transform:translate(30vw,25vh) scale(1.15)}}@keyframes blob2{to{transform:translate(-35vw,20vh) scale(.9)}}@keyframes blob3{to{transform:translate(25vw,-30vh) scale(1.1)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fx-bg i{opacity:.28}}
:root[data-theme="dark"] .fx-bg i{opacity:.28}
/* モダン：やわらかい影・大きめの角丸・余白 */
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]){--elev:0 1px 2px rgba(20,30,40,.05),0 6px 20px rgba(20,30,40,.07)}
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]) :is(.card,.hcard,ul.list,.chart,.tt){border-radius:20px;box-shadow:var(--elev)}
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]) .hcard{padding:14px 16px;margin-top:12px}

  const willDone=(c==="items"||c==="pitems")?!myDone(x): c==="topics"?x.status!=="done": c==="habits"?!habitLog(x)[today()]: c==="plans"?!planDone(x): c==="troubles"?x.status==="doing":false;
  if(willDone) celebrate(); haptic(willDone?"done":"tick");
  let undo=snapUndo(c,id); const lbl=rightLabel(c,x)+(c==="items"&&bothTask(x)&&!myDone(x)?(doneOf(x,otherRole())?"（ふたりとも完了）":`（${nameOf(otherRole())}はまだ）`):"");
  const seq=toastSeq; setTimeout(()=>{ if(toastSeq===seq) toast(`${lbl}：${(x.text||"").slice(0,24)}`,undo,"done"); },0);
  if(c==="items"||c==="pitems"){ const x0=JSON.parse(JSON.stringify(x)), ch=toggleMyDone(c,id)||{};
    if(c==="items"&&x0.list==="shop"){ syncItemSpend({...x0,...ch}); const u1=undo; undo=()=>{ u1&&u1(); syncItemSpend(x0); }; } }
  else if(c==="topics") dupd(c,id,x.status==="done"?{status:"open",doneAt:null,doneDate:null}:{status:"done",doneAt:Date.now(),doneDate:state.talkDate||today()});
  else if(c==="habits") toggleHabit(id,today());
  else if(c==="troubles"){
    if(x.status==="open") dupd(c,id,{status:"doing",assignee:state.me||null,...(getWho(x)==="both"&&!x.who?{}:{})});
    else if(x.status==="doing") dupd(c,id,{status:"done",doneAt:Date.now()});
    else dupd(c,id,{status:"open",assignee:null,doneAt:null});
  } else if(c==="plans"){
    if(x.cat==="anniv"){ const a=annivInfo(x); if(!a){ toast("日付を入れると使えます"); return; } dupd(c,id,{celebrated:x.celebrated===a.cycle?null:a.cycle}); if(x.celebrated!==a.cycle) toast("おめでとうございます"); }
    else dupd(c,id,x.done?{done:false,doneAt:null}:{done:true,doneAt:Date.now()});
  } else if(c==="cautions"){
    if(!cNeedAck(x)){ toast(`${nameOf(authorRole(x))}本人向けの注意なので、確認は不要です`); return; }
    if(isMine(x)){ toast(cPartnerAck(x)?`${nameOf(otherRole())}は確認済みです`:`${nameOf(otherRole())}の確認待ちです（相手が○を押すと確認済みになります）`); return; }
    const k=state.me||"local"; const on=x.ack&&x.ack[k];
    dupd(c,id,{ack:{[k]:on?null:Date.now()}});
  }
}
function rightLabel(c,x){
  if(c==="chores") return ((x.log||{})[today()])?"今日の記録を取り消す":"今日やった";
  if(c==="items"||c==="pitems") return myDone(x)?"戻す":(c==="items"&&bothTask(x)?"自分の分を完了":"完了");
  if(c==="topics") return x.status==="done"?"戻す":"話した";
  if(c==="habits") return (x.log||{})[today()]?"今日を取り消す":"今日できた";
  if(c==="troubles") return x.status==="open"?"対応する":x.status==="doing"?"解決":"未対応に戻す";
  if(c==="cautions"){ if(cCanDo(x)) return cLog(x,myRole())[today()]?"今日を取り消す":"今日できた"; if(!cNeedAck(x)) return ""; return x.by===state.me?"":(x.ack&&x.ack[state.me||"local"]?"未確認に戻す":"確認した"); }
  if(c==="plans") return planDone(x)?"戻す":(PCATS[x.cat]||PCATS.wish).doneL;
  return "";
}

/* Google Calendar one-tap add link */
function gcalUrl(i){
  i={...i,time:myT(i)}; const s=i.due.replace(/-/g,""); let dates;
  if(i.time){ const [h,m]=i.time.split(":").map(Number); const e=new Date(parse(i.due)); e.setHours(h+1,m);
    dates=`${s}T${i.time.replace(":","")}00/${ymd(e).replace(/-/g,"")}T${String(e.getHours()).padStart(2,"0")}${String(e.getMinutes()).padStart(2,"0")}00`; }
  else dates=`${s}/${addDays(i.due,1).replace(/-/g,"")}`;
  const title=(i.list==="shop"?"買い物: ":"")+i.text;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&ctz=Asia%2FTokyo&details=${encodeURIComponent("ふたりのリストから追加")}`;
}

function annivInfo(p){
  if(!p.date) return null; const [y,m,d]=p.date.split("-").map(Number); const t=parse(today());
  let occ=new Date(t.getFullYear(),m-1,d); if(occ<t) occ=new Date(t.getFullYear()+1,m-1,d);
  const days=Math.round((occ-t)/864e5);
  return {occ:ymd(occ),days,years:occ.getFullYear()-y,cycle:String(days<=30?occ.getFullYear():occ.getFullYear()-1)};
}
function planDone(p){ if(p.cat==="anniv"){ const a=annivInfo(p); return !!(a&&p.celebrated===a.cycle); } return !!p.done; }
function planSoon(p){ return p.cat!=="anniv"&&p.date&&!p.done&&p.date<=addDays(today(),30); }

  bits.unshift(whoTag(p));

function checkOp(act,i){

  else { const inp=$("ckText"), t=inp.value.trim(); if(!t) return; checks.push({t,done:false}); inp.value=""; inp.focus(); }

/* habits */
function habitLog(h){ return h.log||{}; }
function toggleHabit(id,date){
  const h=state.habits.find(x=>x.id===id); if(!h) return; if(date>today()) return;
  const on=!habitLog(h)[date]; h.log={...habitLog(h),[date]:on?1:null};
  dupd("habits",id,{log:{[date]:on?1:null}});
  if(on){ const D=habitDue(h); toast(D?`「${h.text}」を記録しました${D.kind==="iv"?`（次は ${short(D.next)} ごろ）`:""}`:`「${h.text}」今日できました`); }
  if(!state.editing) render(); else { const el=document.querySelector(`[data-hday="${date}"][data-hid="${CSS.escape(id)}"]`); if(el) el.classList.toggle("on",on); }
}
function habitStats(h){
  const L=habitLog(h), t=today(); let d=L[t]?t:addDays(t,-1), streak=0; while(L[d]){ streak++; d=addDays(d,-1); }
  const since=h.createdAt?ymd(new Date(h.createdAt)):t; let n=0,k=0;
  for(let i=0;i<30;i++){ const x=addDays(t,-i); if(x<since) break; n++; if(L[x]) k++; }
  const exp=n*weekGoal(h)/7;

const BCOLORS=[["task","緑"],["cal","青"],["shop","橙"],["diary","紫"],["future","青緑"],["danger","赤"]];
const REPS=[["none","この日だけ"],["daily","毎日"],["weekday","平日"],["off","自分の休みの日"]];
function blocksFor(date){

const tmin=s=>{ const [h,m]=(s||"0:0").split(":").map(Number); return h*60+(m||0); };

function dayEntries(date){

  for(const x of state.events) if(x.date===date&&x.start&&mine(x)){ const s0=tmin(x.start), e0=x.end?tmin(x.end):s0+60; out.push({kind:"e",c:"events",x,s:s0,e:e0<=s0?1440:e0,t:x.text,col:"cal"}); }
  for(const i of state.pitems) if(i.due===date&&i.time&&!i.done) out.push({kind:"i",c:"pitems",x:i,s:tmin(i.time),e:tmin(i.time)+(i.dur||30),t:i.text,col:i.list==="shop"?"shop":"task"});
  if(prefs.gShow==="1") for(const g of (state.gEvents[date]||[])) if(!g.allDay) out.push({kind:"g",x:g,s:g.s,e:g.e,t:g.t,col:"muted"});
  out.sort((a,b)=>a.s-b.s||b.e-a.e);

  for(const o of out){ o.lanes=1+Math.max(...out.filter(p=>p.s<o.e&&p.e>o.s).map(p=>p.lane)); }
  return out;
}

function mySchedRange(from,to){
  const mine=x=>state.psFilter==="all"||["both",myRole()].includes(getWho(x)), out=[], inR=d=>d&&d>=from&&d<=to;

  state.pitems.filter(i=>inR(i.due)).forEach(x=>out.push({c:"pitems",x,d:x.due}));
  state.plans.filter(p=>p.cat!=="anniv"&&inR(p.date)&&mine(p)).forEach(x=>out.push({c:"plans",x,d:x.date}));
  for(const p of state.plans.filter(p=>p.cat==="anniv"&&p.date)) for(let d=from;d<=to;d=addDays(d,1)) if(d.slice(5)===p.date.slice(5)&&d>=p.date) out.push({c:"plans",x:p,d});
  state.cautions.filter(c=>inR(c.date)&&mine(c)).forEach(x=>out.push({c:"cautions",x,d:x.date}));
  state.events.filter(e=>inR(e.date)&&mine(e)).forEach(x=>out.push({c:"events",x,d:x.date}));
  return out;
}

function desiredEvents(){
  const t=today(), from=addDays(t,-1), to=addDays(t,60), me=myRole(), out=[], mine=x=>["both",me].includes(getWho(x)), inR=d=>d&&d>=from&&d<=to;
  const ev=(key,title,date,time,dur,desc)=>{ const o={key,summary:title,date,allDay:!time,description:desc||"ふたりのリストから同期"};
    if(time){ const s=tmin(time), e=s+(dur||30); o.start=`${date}T${hhmm(s)}:00+09:00`; o.end=e>=1440?`${addDays(date,1)}T${hhmm(e-1440)}:00+09:00`:`${date}T${hhmm(e)}:00+09:00`; }
    else { o.start=`${date}T00:00:00+09:00`; o.end=`${addDays(date,1)}T00:00:00+09:00`; }
    out.push(o); };
  if(prefs.gsItems==="1") state.items.filter(i=>!myDone(i)&&inR(i.due)&&mine(i)).forEach(i=>ev("i:"+i.id,`${i.list==="shop"?"［買い物］":"［やること］"}${i.text}`,i.due,myT(i),myD(i)||30));
  if(prefs.gsItems==="1") state.events.filter(x=>inR(x.date)&&mine(x)).forEach(x=>{ const s0=x.start?tmin(x.start):0, e0=x.end?tmin(x.end):s0+60; ev("e:"+x.id,`［予定］${x.text}`,x.date,x.start||null,x.start?Math.max(15,(e0<=s0?e0+1440:e0)-s0):null); });
  if(prefs.gsItems==="1") state.plans.filter(p=>p.cat!=="anniv"&&!p.done&&inR(p.date)&&mine(p)).forEach(p=>ev("p:"+p.id,`［${PCATS[p.cat].label}］${p.text}`,p.date));
  if(prefs.gsPitems==="1") state.pitems.filter(i=>!i.done&&inR(i.due)).forEach(i=>ev("m:"+i.id,`${i.list==="shop"?"［買い物］":i.list==="wish"?"［やりたい］":"［タスク］"}${i.text}`,i.due,i.time,i.dur||30,"ふたりのリスト（じぶん）から同期"));
  if(prefs.gsAnniv==="1") state.plans.filter(p=>p.cat==="anniv"&&p.date).forEach(p=>{ const a=annivInfo(p); if(inR(a.occ)) ev(`a:${p.id}:${a.occ.slice(0,4)}`,`［記念日］${p.text}`,a.occ); });
  if(prefs.gsBlocks==="1") for(let d=t;d<=addDays(t,14);d=addDays(d,1)) blocksFor(d).forEach(b=>{ if(b.allDay||!b.start){ ev(`b:${b.id}:${d}`,b.text,d,null,null,"ふたりのリスト（じぶんの予定）から同期"); return; } const en=b.end?tmin(b.end):tmin(b.start)+60, dur=Math.max(15,(en<tmin(b.start)?en+1440:en)-tmin(b.start)); ev(`b:${b.id}:${d}`,b.text,d,b.start,dur,"ふたりのリスト（タイムテーブル）から同期"); });
  if(prefs.gsShift==="1") for(let d=t;d<=to;d=addDays(d,1)){ const s=shiftOf(me,d); if(s) ev(`s:${d}`,`［シフト］${SHIFT_NAME[s]}`,d); }
  return out;
}

/* 単独アプリ版：開いている間は自動でGoogleカレンダーへ同期（変更がなければ通信は一覧の比較だけ） */
let gAutoAt=0;
function gAutoKick(delay){ if(!window.__FUTARI_PWA) return; clearTimeout(gAutoKick.t); gAutoKick.t=setTimeout(()=>{
  if(prefs.gAuto!=="1"||!state.mcp||state.gsBusy||document.hidden||!state.me||!state.blocksLoaded||!state.gsyncLoaded) return;
  if(Date.now()-gAutoAt<15e3){ gAutoKick(15e3); return; } gAutoAt=Date.now(); gsyncRun().catch(()=>{}); },delay??1500); }
setInterval(()=>gAutoKick(0),5*60e3);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) gAutoKick(3000); });
const gKey=k=>k.replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
async function gsyncRun(){
  if(!state.mcp){ state.gsMsg="Googleカレンダー連携が未設定です（config.js の FUTARI_GAS_URL にApps ScriptのURLを入れてください）"; requestRender(); return; }
  if(state.gsBusy) return;
  const want=desiredEvents(), have=new Map(state.gsync.map(g=>[g.id,g])), wantKeys=new Set(want.map(w=>gKey(w.key)));
  const t=today(), jobs=[];
  for(const w of want){ const id=gKey(w.key), h=JSON.stringify([w.summary,w.start,w.end,w.allDay]), g=have.get(id);
    if(!g) jobs.push({op:"create",id,w,h}); else if(g.hash!==h) jobs.push({op:"update",id,w,h,eventId:g.eventId}); }
  for(const [id,g] of have) if(!wantKeys.has(id)&&(g.date||"9")>=addDays(t,-1)) jobs.push({op:"delete",id,eventId:g.eventId});
  if(!jobs.length){ state.gsMsg="変更はありません。"; prefs.gLast=new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); savePrefs(true); requestRender(); return; }
  let ok=0,ng=0,lastErr=null;
  for(let k=0;k<jobs.length;k++){ const j=jobs[k]; state.gsBusy=`同期中 ${k+1}/${jobs.length}`; const el=$("gsState"); if(el) el.textContent=state.gsBusy;
    try{
      if(j.op==="delete"){ try{ await state.mcp.callTool("Google Calendar","delete_event",{eventId:j.eventId,notificationLevel:"NONE"}); }catch(e){ if(e&&e.code!=="tool_error") throw e; } await ddel("gsync",j.id); }
      else { const body={summary:j.w.summary,startTime:j.w.start,endTime:j.w.end,allDay:j.w.allDay,description:j.w.description,timeZone:"Asia/Tokyo",notificationLevel:"NONE"};
        let eventId=j.eventId;
        if(j.op==="update"){ try{ await state.mcp.callTool("Google Calendar","update_event",{eventId,...body}); }catch(e){ if(e&&e.code==="tool_error") eventId=null; else throw e; } }
        if(j.op==="create"||!eventId){ const r=await state.mcp.callTool("Google Calendar","create_event",body); const p=(r&&r.payload)||{}; eventId=p.id||(p.event&&p.event.id)||p.eventId||null; if(!eventId) throw {code:"tool_error",message:"イベントIDを取得できませんでした"}; }
        await dset("gsync",j.id,{eventId,hash:j.h,date:j.w.date,updatedAt:Date.now()}); }
      ok++;
    }catch(e){ ng++; lastErr=e; if(e&&["server_not_connected","needs_reauth","not_in_manifest","not_granted","blocked_by_policy","capability_disabled"].includes(e.code)) break; }
  }
  state.gsBusy=""; state.gsMsg=ng?`${ok}件を反映、${ng}件は失敗：${gErrText(lastErr)}`:`${ok}件をGoogleカレンダーに反映しました。`;
  prefs.gLast=new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); savePrefs(true);
  state.gEvents={}; requestRender(); if(state.view==="psched") loadGoogleDay(state.sel,true);
}

function renderDiaryDynamic(){

    const list=state.diary.filter(x=>!isMine(x)&&(x.text||(x.photos||[]).length)).sort((a,b)=>a.date<b.date?1:-1).slice(0,60);
    tl.innerHTML=list.length?list.map(x=>`<div class="entry"><div class="dt">${jpDate(x.date)}</div><div class="full">${esc(x.text)}</div>${(x.photos||[]).length?`<div class="dphotos">${x.photos.map(id=>`<div class="dph"><button class="dph-img" data-photo="${esc(id)}"><img src="${photoUrl(id)}" alt="" loading="lazy"></button></div>`).join("")}</div>`:""}${commentBlock(x.id)}</div>`).join(""):`<div class="empty">まだ共有された日記はありません</div>`;

  const byDate={}; state.diary.filter(x=>isMine(x)&&(x.text||(x.photos||[]).length)).forEach(x=>byDate[x.date]={text:x.text,priv:false,id:x.id,ph:(x.photos||[]).length});
  state.priv.filter(x=>x.text||(x.photos||[]).length).forEach(x=>byDate[x.id]={text:x.text,priv:true,ph:(x.photos||[]).length});

  refreshExtras();

  if(mc) mc.innerHTML= s&&!diaryPrivNow ? `<div class="section-label">この日記へのコメント</div><div class="entry">${commentBlock(s.id)}</div>` : "";

}

function mondayOf(s){ const d=parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function moneyPeriod(p,ref){

  const y=r.getFullYear(), m=r.getMonth(), s=ymd(new Date(y,m,1)), e=ymd(new Date(y,m+1,1)), sub=[];

/* ================= ふたりのタスクは、それぞれが自分の時間を決められる ================= */
const sharedBoth=i=>!!i&&("who" in i)&&getWho(i)==="both";
const myT=i=>{ const k="time_"+myRole(); return sharedBoth(i)&&(k in i)?i[k]:i.time; };
const myD=i=>{ const k="dur_"+myRole(); return sharedBoth(i)&&(k in i)?i[k]:i.dur; };
const otT=i=>{ const k="time_"+otherRole(); return sharedBoth(i)&&(k in i)?i[k]:i.time; };
function timeCh(i,time,dur){ if(sharedBoth(i)){ const R=myRole(), O=otherRole(), o={["time_"+R]:time}; if(dur!=null) o["dur_"+R]=dur;
    /* 古い共通の時刻は、相手の分として残してから共通欄を空にする（以後は完全に別々） */
    if(i.time!=null&&i.time!==""&&!(("time_"+O) in i)){ o["time_"+O]=i.time; if(i.dur!=null&&!(("dur_"+O) in i)) o["dur_"+O]=i.dur; }
    if(i.time!=null&&i.time!==""){ if(dur==null&&i.dur!=null&&!(("dur_"+R) in i)) o["dur_"+R]=i.dur; o.time=null; o.dur=null; }
    return o; } const o={time}; if(dur!=null) o.dur=dur; return o; }
/* ふたりの「やること」は完了も別々：ふたりとも完了したら全体が完了 */
const bothTask=i=>sharedBoth(i)&&i.list==="task";
const doneOf=(i,r)=>!!i.done||!!i["done_"+r];
const myDone=i=>bothTask(i)?doneOf(i,myRole()):!!i.done;
function toggleMyDone(c,id){
  const x=state[c].find(i=>i.id===id); if(!x) return null;
  if(!(c==="items"&&bothTask(x))){ const ch=x.done?{done:false,doneAt:null,doneBy:null}:{done:true,doneAt:Date.now(),doneBy:myRole()}; dupd(c,id,ch); return ch; }
  const R=myRole(), O=otherRole(), mine=!doneOf(x,R), now=Date.now(), ch={};
  if(x.done&&!mine){ ch.done=false; ch.doneAt=null; ch["done_"+R]=false; ch["doneAt_"+R]=null; if(!(("done_"+O) in x)){ ch["done_"+O]=true; ch["doneAt_"+O]=x.doneAt||now; } }
  else { ch["done_"+R]=mine; ch["doneAt_"+R]=mine?now:null; const both=mine&&doneOf(x,O); ch.done=both; ch.doneAt=both?now:null; }
  dupd(c,id,ch); return ch;
}

  if(!R.length&&!prefs.autoRules&&myRole()==="h") R=[{id:"cook",name:"料理（夕食づくり）",s:"17:00",e:"18:30",on:true,mode:"or",groups:[{mode:"and",conds:[{t:"shift",r:"w",v:["明"],not:false},{t:"shift",r:"h",v:["休"],not:false}]}]}];

function arCond(c,d){

async function shrinkImage(file,max=1600,q=0.8){
  try{ let src; try{ src=await createImageBitmap(file); }catch(e){ src=await new Promise((ok,ng)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=ng; im.src=URL.createObjectURL(file); }); }
    const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, k=Math.min(1,max/Math.max(w,h)), c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height); const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); return b||file; }catch(e){ return file; } }
async function savePhoto(file){ if(!state.assets||!file) return null; try{ const b=await shrinkImage(file); const r=await state.assets.upload(b,{type:"image/jpeg"}); state.assetUsage=null; return r.id; }catch(e){ toast(e&&e.code==="quota_or_state"?"写真の保存容量がいっぱいです。写真なしで登録しました":"写真を保存できませんでした。写真なしで登録しました"); return null; } }

function monthsBack(n){ const t=parse(today()); return [...Array(n)].map((_,i)=>ymd(new Date(t.getFullYear(),t.getMonth()-(n-1-i),1)).slice(0,7)); }
function chartTip(label,val){ return `data-tip="${esc(label)}：${esc(val)}"`; }
function moneyTrendSVG(vals,labels,goal,colorOf){
  const W=320,H=150,pl=34,pb=20,pt=10, n=vals.length, mx=niceTop(Math.max(...vals,goal||0,1)), bw=(W-pl)/n, y=v=>pt+(H-pt-pb)*(1-v/mx);
  const k=mx>=10000?1000:1, fmt=v=>k>1?`${Math.round(v/1000)}千`:Math.round(v);
  const grid=[0,mx/2,mx].map(v=>`<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join("");
  const bars=vals.map((v,i)=>{ const x=pl+i*bw+bw*.16, w=bw*.68, top=y(v), hh=Math.max(0,H-pb-top), r=Math.min(4,hh), over=goal&&v>goal;
    return `<g class="tipg" ${chartTip(labels[i],yen(v)+(goal?`（目標${yen(goal)}）`:""))}><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>${v?`<path d="M${x},${H-pb} V${top+r} q0,-${r} ${r},-${r} h${w-2*r} q${r},0 ${r},${r} V${H-pb} Z" fill="${over?"var(--danger)":(colorOf?colorOf(i):"var(--accent)")}"/>`:""}</g>`; }).join("");
  const gl=goal?`<line x1="${pl}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.2"/><text class="ax" x="${W}" y="${y(goal)-4}" text-anchor="end">目標 ${fmt(goal)}</text>`:"";
  const step=n>8?2:1, xl=labels.map((l,i)=>i%step===(n-1)%step?`<text class="ax" x="${pl+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="mchart" role="img">${grid}${bars}${gl}${xl}</svg>`;
}
function donutSVG(parts,total){

  }

/* diary autosave: one write at a time, coalesced; moves between shared / private when the setting changes */

async function flushDiary(){

  const date=state.diaryDate, text=ta.value.trim(), priv=diaryPrivNow, now=Date.now();
  const hadS=myShared(date), hadP=myPriv(date);
  let photos=[...(((priv?hadP:hadS)||hadS||hadP||{}).photos)||[]]; const pp=diaryPhotoPatch; diaryPhotoPatch=null;
  if(pp&&pp.add) photos=[...photos,...pp.add.filter(x=>!photos.includes(x))]; if(pp&&pp.del) photos=photos.filter(x=>x!==pp.del);
  const has=!!text||photos.length>0;

      if(has) await privSet(date,{date,text,photos,updatedAt:now}); else if(hadP) await privDel(date);
      if(hadS) await sharedDel(hadS.id);

/* ================= movable rail (position saved to the account) ================= */
const railEl=$("rail");

  const top0=railTop0(), bottomPad=parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0;

/* メニューのスクロールは自前で行う（iPhoneで固定位置の中の標準スクロールが描画されない不具合を避ける） */
let rOff=0;
const rMax=()=>{ const r=$("rscroll"), n=$("rinner"); return r&&n?Math.max(0,n.offsetHeight-r.clientHeight):0; };

function railShade(){ const r=$("rscroll"); if(!r) return; const mx=rMax(), T=$("rfT"), B=$("rfB");
  if(rOff>mx){ rOff=mx; const n=$("rinner"); if(n) n.style.transform=`translateY(${-rOff}px)`; }
  T.style.top=r.offsetTop+"px"; B.style.top=(r.offsetTop+r.clientHeight-22)+"px";
  T.classList.toggle("on",mx>0&&rOff>4); B.classList.toggle("on",mx>0&&rOff<mx-4); }

  const t=b.offsetTop, h=r.clientHeight; if(t<rOff+4) setROff(t-8,true); else if(t+b.offsetHeight>rOff+h-4) setROff(t+b.offsetHeight-h+8,true); else railShade(); }
let rsc=null;
$("rscroll").addEventListener("pointerdown",e=>{ if(rMax()<=0) return; rsc={y:e.clientY,o:rOff,on:false,pid:e.pointerId}; });
addEventListener("pointermove",e=>{ if(!rsc||e.pointerId!==rsc.pid) return; const dy=e.clientY-rsc.y; if(!rsc.on&&Math.abs(dy)>6){ rsc.on=true; railDrag.moved=true; } if(rsc.on){ setROff(rsc.o-dy); e.preventDefault(); } },{passive:false});
const endRsc=e=>{ if(!rsc||(e&&e.pointerId!==rsc.pid)) return; const was=rsc.on; rsc=null; if(was) setTimeout(()=>railDrag.moved=false,30); };
addEventListener("pointerup",endRsc); addEventListener("pointercancel",endRsc);

addEventListener("resize",()=>{ railFit(); placeRail(false); });
function placeRail(anim){
  railFit();
  const h=railEl.offsetHeight, top0=railTop0();
  const bottomPad=parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0;
  const maxTop=Math.max(top0,innerHeight-bottomPad-16-h);
  let top=prefs.railY<0?maxTop:Math.round(prefs.railY*innerHeight);
  if(top-top0<56) top=top0; /* ドックの近くならドックの真下にくっつける */
  top=Math.min(Math.max(top,top0),maxTop);
  railEl.classList.toggle("snap",!!anim);
  railEl.style.top=top+"px";
  railEl.style.left=prefs.railSide==="left"?`calc(10px + env(safe-area-inset-left,0px))`:`calc(100% - ${railEl.offsetWidth+10}px - env(safe-area-inset-right,0px))`;

/* メニューを置ける一番上：縦ドックがある時はドックのすぐ下（すき間はメニュー内と同じ8px）、ない時はヘッダーの下 */
function railTop0(){
  const safe=12+(parseFloat(getComputedStyle(document.documentElement).paddingTop)||0); if(innerWidth>=760) return safe;
  const dock=document.querySelector(".brand .hr");
  if(dock&&getComputedStyle(dock).flexDirection==="column") return Math.max(safe,Math.round(dock.getBoundingClientRect().bottom)+8);
  const hd=document.querySelector("header"); return Math.max(safe,hd?hd.getBoundingClientRect().bottom+8:0);

/* 右上のボタン列（ドック）を、下のメニューと縦の線がぴったりそろうように合わせる（文字サイズの拡大にも対応） */

const QK={task:["やること","--task"],shop:["買い物","--shop"],event:["予定","--cal"],ptask:["🔒じぶんのタスク","--task"],pshop:["🔒じぶんの買い物","--shop"],topic:["話すこと","--talk"],trouble:["困りごと","--trouble"],caution:["注意","--caution"]};
function qNames(){ const o=[]; for(const r of ["h","w"]){ const n=nameOf(r)||""; if(n) o.push([n,r]); if(n.length>=2) o.push([n.slice(0,2),r]); } if(prefs.nick) o.push([prefs.nick,myRole()]); return o.sort((a,b)=>b[0].length-a[0].length); }
function nextDow(from,dw,week){ const d=parse(from); let k=(dw-d.getDay()+7)%7; if(week==="next"){ k=(dw-d.getDay()+7)%7+7; if(d.getDay()===0) k-=7; } else if(!k) k=7; return addDays(from,k); }
function quickRule(src){
  let t=" "+src.trim()+" ", date="", time="", end="", who="", kind="";
  const T=today(), z=x=>String(x).padStart(2,"0"), cut=re=>{ t=t.replace(re," "); };
  let m;
  if((m=t.match(/(今日|本日)/))){ date=T; cut(m[0]); } else if((m=t.match(/(明後日|あさって)/))){ date=addDays(T,2); cut(m[0]); } else if((m=t.match(/(明日|あした)/))){ date=addDays(T,1); cut(m[0]); }
  if(!date&&(m=t.match(/(来週|今週)?の?([日月火水木金土])曜日?/))){ date=nextDow(T,"日月火水木金土".indexOf(m[2]),m[1]==="来週"?"next":""); cut(m[0]); }
  if(!date&&(m=t.match(/(\d{1,2})[\/月](\d{1,2})日?/))){ let y=parse(T).getFullYear(); let d=`${y}-${z(m[1])}-${z(m[2])}`; if(d<T) d=`${y+1}-${z(m[1])}-${z(m[2])}`; date=d; cut(m[0]); }
  if(!date&&(m=t.match(/(\d{1,2})日(?!間)/))){ const y=parse(T).getFullYear(), mo=parse(T).getMonth()+1; let d=`${y}-${z(mo)}-${z(m[1])}`; if(d<T){ const n=new Date(y,mo,Number(m[1])); d=ymd(n); } date=d; cut(m[0]); }
  const tm=(h,mi,pm)=>{ h=Number(h); if(pm&&h<12) h+=12; return `${z(h)}:${z(mi||0)}`; };
  if((m=t.match(/(午後|夜|夕方)?\s*(\d{1,2})(?:[:：時](\d{2})?分?|時半)\s*(?:[〜~\-ー]|から)\s*(\d{1,2})(?:[:：時](\d{2})?分?)?/))){ time=tm(m[2],/半/.test(m[0])?30:m[3],!!m[1]); end=tm(m[4],m[5],!!m[1]&&Number(m[4])<12); cut(m[0]); }
  else if((m=t.match(/(午後|夜|夕方|午前|朝)?\s*(\d{1,2})(?:[:：](\d{2})|時(半|(\d{1,2})分)?)/))){ time=tm(m[2],m[3]||(m[4]==="半"?30:m[5]),/午後|夜|夕方/.test(m[1]||"")); cut(m[0]); }
  if((m=t.match(/(ふたり|二人|2人|ふたりで)/))){ who="both"; cut(m[0]); }
  else if((m=t.match(/(じぶん|自分)(だけ|用)?/))){ who="priv"; cut(m[0]); }
  else { for(const [n,r] of qNames()){ const re=new RegExp(n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(が|に|の|と|さん)?"); if(re.test(t)){ who=r; cut(re); break; } } }
  const body=t.replace(/\s+/g," ").trim();
  if(/(を?買う|買い物|を?買って|購入|補充|切れそう|切れた)/.test(body)) kind="shop";
  else if(/(話したい|話そう|相談|話し合)/.test(body)) kind="topic";
  else if(/(困っ|困る|壊れ|故障|動かない|できない)/.test(body)) kind="trouble";
  else if(/(注意|気をつけ|禁止|しないで|厳禁)/.test(body)) kind="caution";
  else if(time||/(予約|病院|歯医者|美容院|会議|飲み会|打ち合わせ|誕生日|結婚式|旅行|帰省|健診|検診|ライブ|映画|面談)/.test(body)&&date) kind="event";
  else kind="task";
  let text=body.replace(/^(を|に|で|の)\s*/,"").replace(/\s*(を買う|を買って|買う)$/,"").trim()||src.trim();
  if(who==="priv"){ if(kind==="task") kind="ptask"; else if(kind==="shop") kind="pshop"; who=""; }
  return {kind,text,date,time,end,who:who||"both"};
}
async function quickParse(src){
  const R=quickRule(src), ai=aiText(); if(!ai) return {...R,by:"rule"};
  const prompt=`夫婦の共有アプリへの一行入力を仕分けてください。今日は${today()}（${"日月火水木金土"[parse(today()).getDay()]}曜）。夫＝${nameOf("h")}、妻＝${nameOf("w")}、入力した人＝${nameOf(myRole())}。
入力：「${src}」
kind は次のどれか：task（ふたりのやること）/shop（買い物）/event（日時のある予定）/ptask（入力した人だけのタスク）/pshop（入力した人だけの買い物）/topic（話し合いたいこと）/trouble（困りごと）/caution（注意・ルール）
who は both / h / w（誰の分か。不明なら both）。日付は YYYY-MM-DD、時刻は HH:MM（なければ空文字）。text は日付・時刻・人名を除いた短い名前。
JSONだけを返す：{"kind":"task","text":"","date":"","time":"","end":"","who":"both"}`;
  try{ const d=await ai.json(prompt,{modelTier:"quick"}); if(d&&QK[d.kind]&&d.text){ const ok=x=>/^\d{4}-\d{2}-\d{2}$/.test(x||""), okt=x=>/^\d{2}:\d{2}$/.test(x||"");
      return {kind:d.kind,text:String(d.text).slice(0,80),date:ok(d.date)?d.date:"",time:okt(d.time)?d.time:"",end:okt(d.end)?d.end:"",who:["both","h","w"].includes(d.who)?d.who:"both",by:"ai"}; } }catch(e){}

function jpHolidays(y){ const S=new Set(), f=(m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const nth=(m,n)=>{ const w=new Date(y,m-1,1).getDay(); return 1+((8-w)%7)+(n-1)*7; };
  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>S.add(f(m,d)));
  S.add(f(1,nth(1,2))); S.add(f(7,nth(7,3))); S.add(f(9,nth(9,3))); S.add(f(10,nth(10,2)));
  const k=y-1980; S.add(f(3,Math.floor(20.8431+0.242194*k-Math.floor(k/4)))); S.add(f(9,Math.floor(23.2488+0.242194*k-Math.floor(k/4))));
  for(const d of [...S].sort()){ if(parse(d).getDay()===0){ let x=addDays(d,1); while(S.has(x)) x=addDays(x,1); S.add(x); } }
  for(const d of [...S]){ const x=addDays(d,2); if(S.has(x)&&!S.has(addDays(d,1))&&parse(addDays(d,1)).getDay()!==0) S.add(addDays(d,1)); }
  return S; }

  claude.use("sample").then(async sm=>{ if(sm){ state.sampleTxt=sm; requestRender(); } if(!sm){ state.sampleWhy="この表示環境ではClaudeへの問い合わせ機能そのものが提供されていません"; state.sampleNote="この画面ではClaudeの自動読み取りが使えません。写真を見ながら入力してください"; requestRender(); return; } try{ const L=await sm.limits(); if(!L||!L.images){ state.sampleWhy="Claudeへの問い合わせはできますが、この表示環境は写真の送信に対応していません"; state.sampleNote="この画面では写真の自動読み取りに対応していません。写真を見ながら入力してください"; requestRender(); } if(L&&L.images){ state.sample=sm; state.sampleImg=L.images; const inp=$("rcptIn"); if(inp&&L.images.mediaTypes) inp.accept=L.images.mediaTypes.join(","); requestRender(); } }catch(e){} }).catch(()=>{});
  claude.use("mcp").then(m=>{ state.mcp=m; if(state.view==="psched") requestRender(); if(m) gAutoKick(8000); }).catch(()=>{});
  histDoc=db.doc("meta/history");
  if(state.me){ try{ prefsDoc=db.doc(`data/users/${state.me}/prefs`); privBase=db.doc(`data/users/${state.me}/private`); privCol=privBase.collection("diary"); }catch(e){ prefsDoc=null; privCol=null; privBase=null; } }
  famDoc=db.doc("meta/family");
  rolesDoc=db.doc("meta/roles");
  if(!state.me&&state.owner===false&&!prefsDoc){ /* no account id: keep this person's settings in the shared store (appearance only — not secret) */
    prefsDoc=db.doc("meta/prefs_w"); }
  if(!state.me){ /* invited from outside the organization: no account id → encrypted private vault */
    vaultCol=db.collection("vault_w"); state.vaultRaw={};
    vaultCol.onSnapshot(async s=>{ for(const d of s.docs){ const v=d.data(); if(d.id==="meta") state.vaultMeta=v; else state.vaultRaw[d.id]=v; }
      if(!state.vaultKey&&state.vaultMeta&&store.get("futari.vpin")) await vaultUnlock(store.get("futari.vpin"),true);
      else if(state.vaultKey) await vaultDecryptAll();
      requestRender(); },()=>{});
  }
  rolesDoc.onSnapshot(s=>{ state.roles=s.exists?s.data():{}; state.rolesLoaded=true; resolveRole(); requestRender(); if(!$("onb").hidden) renderOnb(); },()=>{ state.rolesLoaded=true; });
  famDoc.onSnapshot(s=>{ if(s.exists){ const f=s.data(); state.fam={h:f.h||"陸功",w:f.w||"紀香"}; requestRender(); } },()=>{});
  if(privBase) for(const c of PRIVATE) privBase.collection(c).onSnapshot(s=>{ state[c]=s.docs.map(x=>({id:x.id,...x.data()})); state[c+"Loaded"]=true; if(c!=="gsync") gAutoKick(4000); if(c==="blocks"){ state.blocksLoaded=true; autoCook(); } requestRender(); },()=>{});
  const live=()=>{ $("sync").classList.add("live"); $("syncText").textContent="共有中"; };
  const lost=()=>{ $("sync").classList.remove("live"); $("syncText").textContent="再読み込みしてください"; };
  const GK=new Set(["items","events","plans","shifts"]);
  const sub=(c,onChange)=>db.collection(c).onSnapshot(s=>{ state[c]=s.docs.map(x=>({id:x.id,...x.data()})); state.readOnlyCache=false; live(); onChange(); resolveNames(); cacheSave(); if(GK.has(c)&&!s.metadata?.fromCache) gAutoKick(4000); },lost);
  sub("items",requestRender); sub("troubles",requestRender); sub("cautions",requestRender); sub("shifts",()=>{ state.shiftsLoaded=true; requestRender(); autoCook(); wcKick(); }); sub("events",requestRender); sub("plans",requestRender); sub("topics",requestRender); sub("talks",requestRender); sub("bugs",()=>{ if(state.view==="settings"){ const c=$("bugCard"); if(c&&!typingInMain()) c.outerHTML=bugCard(); } else requestRender(); });
  sub("comments",()=>{ if(state.view==="diary"){ renderDiaryDynamic(); markCommentsSeen(); renderChrome(); } else requestRender(); });
  sub("chores",requestRender); sub("qa",requestRender); sub("spend",requestRender); sub("photos",()=>{}); sub("recur",requestRender); sub("goals",requestRender); kakeiDoc=db.doc("meta/kakei"); kakeiDoc.onSnapshot(s=>{ state.kakei=s.exists?s.data():{}; state.kakeiLoaded=true; requestRender(); wcKick(); },()=>{}); sub("thanks",()=>{ if(state.view==="diary") refreshExtras(); else requestRender(); }); sub("dinner",()=>{ if(state.view==="diary") refreshExtras(); else requestRender(); });
  sub("diary",()=>{ if(state.view==="diary") renderDiaryDynamic(); else requestRender(); });
  { let pr=false; db.collection("activity").onSnapshot(s=>{ state.activity=s.docs.map(x=>({id:x.id,...x.data()})); if(!pr){ pr=true; setTimeout(actPrune,5000); } if(state.view==="home"||state.view==="log") requestRender(); else renderChrome(); },()=>{}); }
  if(privCol) privCol.onSnapshot(s=>{ state.priv=s.docs.map(x=>({id:x.id,...x.data()})); if(state.view==="diary") renderDiaryDynamic(); else requestRender(); },()=>{});
  histDoc.onSnapshot(s=>{ const n=s.exists&&s.data().names; state.history=Array.isArray(n)?n:[]; requestRender(); },()=>{});
  if(prefsDoc) prefsDoc.onSnapshot(s=>{ if(!s.exists){ if(s.fromCache) return; savePrefs(true); maybeOnb(); return; } const p=s.data(); const next={...DEFAULT_PREFS};
    for(const k of Object.keys(DEFAULT_PREFS)) if(typeof p[k]===typeof DEFAULT_PREFS[k]) next[k]=p[k];
    if(next.autoRules!==prefs.autoRules) AR=null;
    const first=firstPrefs; firstPrefs=false;
    if(next.gShowV!=="1"){ next.gShow="1"; next.gShowV="1"; setTimeout(()=>savePrefs(true),500); }
    if(JSON.stringify(next)!==JSON.stringify(prefs)){ prefs=next; store.set("futari.prefs",JSON.stringify(prefs)); applyPrefs(); resolveRole();
      if(first&&TITLES[prefs.view]&&prefs.view!=="settings"&&state.view!==prefs.view&&!state.editing&&!state.sheet.open) state.view=prefs.view;
      render(); placeRail(false); }
    if(first){ if(prefs.onboarded==="1"&&state.onbAuto&&!$("onb").hidden&&ONB.mode==="setup"){ $("onb").hidden=true; state.onbAuto=false; render(); } maybeOnb(); } },()=>{});
})();
</script>
