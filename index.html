/* timetable */
.tt{position:relative;background:var(--surface);border-radius:14px;overflow:hidden;touch-action:pan-y;cursor:copy}
.tt-h{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}

.tt-ck svg{width:12px;height:12px;stroke:var(--bc);opacity:.35}.tt-ck:active svg{opacity:1}

.tt-b{touch-action:pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}

.tt{overflow:visible}.tt-h:first-child{border-top-left-radius:14px;border-top-right-radius:14px}

/* ================= スタイル（クラシック／モダン／グラス／ダイナミック）と全体の操作感 ================= */
/* 共通：押した手応え・フォーカス・なめらかな色の変化 */
.opt,.chip,.btn,.hbtn,.pill,.rtab,.rhome,.seg button,.lsw button,.stile,.hl,.hlist button,.icon-btn,.tt-bar button{transition:transform .12s ease,background-color .18s,color .18s,box-shadow .18s}
.opt:active,.chip:active,.btn:active,.hbtn:active,.pill:active,.rtab:active,.rhome:active,.seg button:active,.lsw button:active,.stile:active,.hl:active,.icon-btn:active,.tt-bar button:active{transform:scale(.95)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
.opt{min-height:40px}
.onb-names{display:grid;grid-template-columns:1fr 1fr;gap:10px}.onb-names label{display:flex;flex-direction:column;gap:4px;min-width:0}.onb-names input{width:100%;box-sizing:border-box;min-width:0}
/* スタイル選択タイル */
.stiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1.5px solid var(--line);background:var(--ground);border-radius:16px;padding:10px;cursor:pointer;color:var(--ink)}
.stile[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.stile b{font-size:14px}.stile small{font-size:11px;color:var(--muted);line-height:1.35}
.stpv{position:relative;width:100%;height:46px;border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:4px}
.stpv i{position:absolute;border-radius:8px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stpv i:nth-child(1){left:8px;top:8px;width:45%;height:12px}.stpv i:nth-child(2){left:8px;top:26px;width:70%;height:12px}.stpv i:nth-child(3){right:8px;top:8px;width:14px;height:30px;border-radius:7px}
.st-classic .stpv{background:var(--ground)}.st-classic .stpv i{border-radius:4px;box-shadow:none;border:1px solid var(--line)}
.st-modern .stpv{background:linear-gradient(180deg,var(--ground),color-mix(in srgb,var(--accent) 6%,var(--ground)))}.st-modern .stpv i{border-radius:9px;box-shadow:0 4px 10px rgba(0,0,0,.10)}
.st-glass .stpv,.st-dynamic .stpv{background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 55%,transparent),transparent 60%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--diary) 55%,transparent),transparent 60%),var(--ground)}
.st-glass .stpv i,.st-dynamic .stpv i{background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid color-mix(in srgb,#fff 40%,transparent)}
.st-dynamic .stpv{background-size:160% 160%;animation:stpv 5s ease-in-out infinite alternate}
@keyframes stpv{to{background-position:100% 100%}}
/* 背景のにじみ（グラス／ダイナミック） */
.fx-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;display:none}
.fx-bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.38}
.fx-bg i:nth-child(1){left:-25vmax;top:-20vmax;background:var(--accent)}
.fx-bg i:nth-child(2){right:-30vmax;top:20vh;background:var(--diary)}
.fx-bg i:nth-child(3){left:-10vmax;bottom:-35vmax;background:var(--cal)}
:root[data-style="glass"] .fx-bg,:root[data-style="dynamic"] .fx-bg{display:block}
:root[data-style="dynamic"] .fx-bg i:nth-child(1){animation:blob1 22s ease-in-out infinite alternate}
:root[data-style="dynamic"] .fx-bg i:nth-child(2){animation:blob2 26s ease-in-out infinite alternate}
:root[data-style="dynamic"] .fx-bg i:nth-child(3){animation:blob3 30s ease-in-out infinite alternate}
@keyframes blob1{to{transform:translate(30vw,25vh) scale(1.15)}}@keyframes blob2{to{transform:translate(-35vw,20vh) scale(.9)}}@keyframes blob3{to{transform:translate(25vw,-30vh) scale(1.1)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fx-bg i{opacity:.28}}
:root[data-theme="dark"] .fx-bg i{opacity:.28}
/* モダン：やわらかい影・大きめの角丸・余白 */
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]){--elev:0 1px 2px rgba(20,30,40,.05),0 6px 20px rgba(20,30,40,.07)}
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]) :is(.card,.hcard,ul.list,.chart,.tt){border-radius:20px;box-shadow:var(--elev)}
:root:is([data-style="modern"],[data-style="glass"],[data-style="dynamic"]) .hcard{padding:14px 16px;margin-top:12px}

.trow h1{min-width:0}
.wx{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;cursor:pointer;padding:5px 12px 5px 8px;border-radius:16px;background:color-mix(in srgb,var(--surface) 72%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent) inset;color:var(--ink);margin-top:4px}
.wx[hidden]{display:none}
.wx[aria-expanded="true"]{box-shadow:0 0 0 1.5px var(--accent) inset}
.wxs{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wxs.sun,.wxs.sunc{color:#E0A021}.wxs.rain,.wxs.storm{color:var(--cal)}.wxs.snow{color:#7FA7C9}.wxs.moon,.wxs.moonc{color:var(--reflect,#6a5acd)}.wxs.cloud,.wxs.fog{color:var(--muted)}
.wx-t{display:grid;line-height:1.1;text-align:left}
.wx-t b{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.wx-t small{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-t small i{font-style:normal;opacity:.5}
.wx-p{color:var(--cal);font-weight:700}
.wxp{position:fixed;z-index:35;box-sizing:border-box;padding:12px 14px;border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 14px 40px rgba(0,0,0,.2);border:1px solid color-mix(in srgb,#fff 25%,transparent);animation:tbIn .18s ease-out}
.wxp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.wxp-hr{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.wxh{flex:none;width:44px;display:grid;justify-items:center;gap:2px;font-variant-numeric:tabular-nums}
.wxh small{font-size:10.5px;color:var(--muted)}
.wxh .wxs{width:22px;height:22px}
.wxh b{font-size:13px}
.wxh-p{font-size:10px;color:var(--cal);font-weight:700;height:12px}
.wxp-d{display:grid;gap:4px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:8px}
.wxd{display:grid;grid-template-columns:56px 24px 1fr auto 34px 30px;align-items:center;gap:6px;font-size:13px;font-variant-numeric:tabular-nums}
.wxd .wxs{width:22px;height:22px}
.wxd-n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxd-p{color:var(--cal);font-size:12px;font-weight:700}
.wxd b{text-align:right}.wxd small{color:var(--muted);text-align:right}
.wxp-f{margin-top:8px;font-size:10.5px}

/* v90: アイコンを選べるように（名前の左のマーク） */
#appTitle.big::before{background:var(--logo) center/cover no-repeat!important}
.logos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.logo-o{border:0;background:none;display:grid;justify-items:center;gap:4px;cursor:pointer;padding:6px 0;border-radius:12px;color:var(--ink)}
.logo-o[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.logo-pv{width:40px;height:40px;border-radius:11px;display:block;background-size:cover;background-position:center;box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent)}
.logo-o[aria-pressed="true"] .logo-pv{box-shadow:0 0 0 2px var(--accent)}
.logo-o small{font-size:10px;color:var(--muted)}
/* v90: 検索 */
.srch{position:relative;margin-top:12px;display:flex;align-items:center}
.srch>svg{position:absolute;left:14px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.srch input{flex:1;min-width:0;height:44px;border-radius:14px;padding:0 40px 0 40px;font-size:16px;-webkit-appearance:none;appearance:none}
.srch input::-webkit-search-cancel-button{display:none}
.srch-x{position:absolute;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--ink);font-size:16px;line-height:1;cursor:pointer}
.srch-res:empty{display:none}
.srch-res{margin-top:8px;padding:10px 12px;border-radius:18px;background:var(--surface);display:grid;gap:6px}
.srch-g{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:2px}
.srch-tabs{display:flex;flex-wrap:wrap;gap:6px}
.srch-tab{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;height:36px;padding:0 12px 0 8px;background:color-mix(in srgb,var(--tabc,var(--accent)) 12%,transparent);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer}
.srch-tab svg{width:18px;height:18px;fill:none;stroke:var(--tabc,var(--accent));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srch-tab .ib{width:22px;height:22px}
.srch-l{list-style:none;margin:0;padding:0}
.srch-l button{width:100%;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center;text-align:left;border:0;background:none;padding:8px 2px;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);cursor:pointer;color:var(--ink)}
.srch-l button.dn .srch-t{text-decoration:line-through;color:var(--muted)}
.srch-k{font-size:10.5px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:6px;padding:2px 6px;white-space:nowrap}
.srch-t{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srch-l small{grid-column:2;font-size:11px;color:var(--muted)}
.srch-none{font-size:13px;color:var(--muted);text-align:center;padding:6px}
li.item.flash{animation:flash 1.5s ease}
@keyframes flash{0%,60%{background:color-mix(in srgb,var(--accent) 18%,transparent)}100%{background:transparent}}
:root:is([data-style="glass"],[data-style="dynamic"]) .srch-res{background:var(--glass)!important;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:var(--glassb)}
/* v90: 縦フリックにふたり／じぶんの切り替え */
.flayers{display:grid;gap:3px;padding:2px 0 4px}
.flayers button{border:0;border-radius:10px;height:26px;font-size:10px;font-weight:700;color:var(--muted);background:var(--ground);cursor:pointer;padding:0}
.flayers button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
body.layer-me .flayers button[data-flayer="me"][aria-pressed="true"]{background:var(--reflect,#6a5acd);color:#fff}

/* v91: 月／週の切り替え */
.cal-tools{justify-content:space-between}
.calmode{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:14px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.calmode button{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;min-width:74px;height:38px;border-radius:11px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
.calmode button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.calmode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.today-p{min-width:64px}
#grid:not(.painting){touch-action:pan-y!important}
.logo-ai{margin-top:8px;display:grid;gap:6px}

/* v92: メニューの並びを逆に（縦メニューはタブの上下を入れ替え） */
body.nav-rev .rinner{flex-direction:column-reverse}

/* v93: 上部の表示（位置・大きさ・たたむ・並び） */
.brand .appname>*{order:var(--o-brand,0)}
.brand .greet>*{order:var(--o-greet,1)}
.brand .trow{order:var(--o-title,2)}
.brand .hsub,.brand #lock{order:var(--o-layer,3)}
html body.hh-brand .brand .appname>*,html body.hh-greet .brand .greet>*,html body.hh-layer .brand .hsub,html body.hh-layer .brand #lock{display:none!important}
html body.hdr-fold .brand .appname>*,html body.hdr-fold .brand .greet>*,html body.hdr-fold .brand .hsub,html body.hdr-fold .brand #lock{display:none!important}
.trow-r{display:inline-flex;align-items:center;gap:6px;flex:none}
.hfold{width:30px;height:30px;border:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--muted);cursor:pointer;flex:none;margin-top:4px}
.hfold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
body.hdr-fold .hfold svg{transform:rotate(180deg)}
body.hdr-fold .brand h1{margin-top:0!important}
body.hs-s .brand>div:not(.hr){zoom:.86}
body.hs-l .brand>div:not(.hr){zoom:1.14}
/* スクロールで隠れる */
html body.hdr-scroll header{position:relative!important;top:auto!important}
body.hdr-scroll .hdr-bg{display:none!important}
/* 画面の下 */
html:root:root:root body.hdr-bottom header{position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0;z-index:8;margin:0!important;padding:10px max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left))!important;border-radius:22px 22px 0 0;background:color-mix(in srgb,var(--surface) 82%,transparent)!important;backdrop-filter:blur(18px) saturate(1.4)!important;-webkit-backdrop-filter:blur(18px) saturate(1.4)!important;box-shadow:0 -8px 30px rgba(0,0,0,.12);border-top:1px solid color-mix(in srgb,#fff 25%,transparent)}
body.hdr-bottom .hdr-bg{display:none!important}
html body.hdr-bottom .brand{grid-template-columns:minmax(0,1fr) auto!important}
html body.hdr-bottom .brand .hr{flex-direction:row!important;width:auto!important;background:none!important;box-shadow:none!important;border:0!important;padding:0!important;transform:none!important;align-self:center}
html body.hdr-bottom .brand .hr .hbtn{width:42px!important;height:42px!important}
body.hdr-bottom .app{padding-bottom:calc(var(--hdrbh,200px) + 24px)!important}
body.hdr-bottom #main{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}
body.hdr-bottom.nav-flick .fbar,body.hdr-bottom.nav-railf .fbar{bottom:calc(var(--hdrbh,200px) + 10px)}
body.hdr-bottom #toast{bottom:calc(var(--hdrbh,200px) + 16px)!important}
body.hdr-bottom.nav-flick #toast{bottom:calc(var(--hdrbh,200px) + 90px)!important}
.hord{list-style:none;margin:6px 0 8px;padding:0;display:grid;gap:6px}
.hord li{display:flex;align-items:center;gap:6px}
.hord-n{flex:1;font-size:14px;font-weight:600}
.hord .icon-btn{width:34px;height:34px}
.hord .opt{min-width:64px}
.hord-s{font-size:11px;color:var(--muted);min-width:64px;text-align:center}

/* v94: フリックのメニューを動かすつまみ */
.fgrip{position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:48px;height:18px;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;display:grid;place-items:center;z-index:2}
.fgrip span{width:34px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 30%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--surface) 70%,transparent)}
.fbar.dragging{transition:none!important;box-shadow:0 18px 40px rgba(0,0,0,.28);opacity:.95}
.fbar.dragging .fgrip{cursor:grabbing}
.fbar.moved{margin:0!important}

/* v95: 背景の写真 */
#bgPhoto{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bgimg) center/cover no-repeat}
#bgPhoto.blur{filter:blur(14px) saturate(1.1);inset:-30px}
#bgPhoto::after{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--ground) var(--bgdim,45%),transparent)}
html.has-bgphoto body{background:transparent!important}
html.has-bgphoto .fx-bg{display:none!important}
html.has-bgphoto{background:var(--ground)}
/* v95: AIで作るのはみ出し */
.logo-ai .edit-row{flex-wrap:nowrap!important;min-width:0}
.logo-ai input{min-width:0!important;width:auto!important;flex:1 1 auto}
.logo-ai .btn{flex:none;white-space:nowrap}

/* v96: 上部の部品ごとの大きさ */
.brand .appname>*{zoom:var(--z-brand,1)}
.brand .greet>*{zoom:var(--z-greet,1)}
.brand .trow{zoom:var(--z-title,1)}
.brand .hsub,.brand #lock{zoom:var(--z-layer,1)}
.hord li{display:grid!important;grid-template-columns:1fr auto auto;grid-template-areas:"n u d" "z z v";gap:6px 6px!important;align-items:center;padding:8px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.hord li:first-child{border-top:0}
.hord-n{display:contents}
.hord-n>.hsz{grid-area:z}
.hord li .icon-btn[data-d="-1"]{grid-area:u}.hord li .icon-btn[data-d="1"]{grid-area:d}
.hord li>.opt,.hord li>.hord-s{grid-area:v;justify-self:end}
.hord-t{grid-area:n;font-size:14px;font-weight:700}
.hsz{display:inline-flex;gap:3px;padding:2px;border-radius:10px;background:color-mix(in srgb,var(--ink) 7%,transparent);width:max-content}
.hsz button{border:0;background:transparent;border-radius:8px;height:26px;min-width:34px;padding:0 6px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.hsz button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* v97: アプリのアイコン（名前の左）の大きさ */
body.lsz-s #appTitle.big::before{width:.85em;height:.85em}
body.lsz-l #appTitle.big::before{width:1.35em;height:1.35em;border-radius:.34em}
body.lsz-xl #appTitle.big::before{width:1.7em;height:1.7em;border-radius:.4em}
/* v97: メニューのアイコンの大きさ・色 */
body.mic-s :is(.rtab,.rhome,.fkey:not(.add)) svg{width:18px!important;height:18px!important}
body.mic-l :is(.rtab,.rhome,.fkey:not(.add)) svg{width:26px!important;height:26px!important}
body.mic-xl :is(.rtab,.rhome,.fkey:not(.add)) svg{width:30px!important;height:30px!important}
body.mic-xl .rtab{height:56px}
body.micc-tab :is(.rtab,.fkey):not([aria-selected="true"]):not([aria-current="true"]) svg{color:var(--tabc,var(--muted))}
body.micc-accent :is(.rtab,.rhome,.fkey:not(.add)):not([aria-selected="true"]):not([aria-current="true"]) svg{color:var(--accent)}

/* v98: 習慣の「できなかった」 */
.hd.miss{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 45%,transparent)}
.hmissb{border:0;margin-left:6px;height:22px;padding:0 9px;border-radius:999px;font-size:10.5px;font-weight:700;background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--muted);cursor:pointer;white-space:nowrap}
.hmissb.on{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.htag.skip{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}

/* v98: 写真の上の文字を読みやすく（見出しに薄い影） */
html.has-bgphoto header :is(h1,#appTitle,.gw){text-shadow:0 1px 8px color-mix(in srgb,var(--ground) 70%,transparent)}

/* v98: 今日の1曲 */
.song{flex:0 1 auto;min-width:0;max-width:128px;display:inline-flex;align-items:center;gap:5px;border:0;cursor:pointer;height:40px;padding:0 10px 0 8px;border-radius:14px;background:color-mix(in srgb,var(--surface) 72%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--line) 70%,transparent) inset;color:var(--ink);margin-top:4px;font-size:12px;font-weight:700}
.song[hidden]{display:none}
.song svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--diary);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.song span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow-r{min-width:0}
.song-t{font-size:18px;font-weight:800;line-height:1.35}
.song-a{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.song-r{font-size:13px;line-height:1.6;margin:8px 0 0}
.song-l{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.song-sg{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}.song-sg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;padding:8px 12px;cursor:pointer;white-space:nowrap}.song-sg button+button{border-left:1.5px solid var(--line)}
.song-top{display:flex;align-items:center;gap:12px}.song-top>div{flex:1;min-width:0}.song-art{width:56px;height:56px;border-radius:10px;flex:none;object-fit:cover}
.song-pl,.song-nx{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;cursor:pointer}.song-nx{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-size:20px}.song-pl.wait{opacity:.5}
.song-l .btn{text-decoration:none;display:inline-flex;align-items:center}
.song-f{display:flex;gap:14px;margin-top:10px}

/* v99: 定期のもの（次の1回） */
.rec-row{list-style:none}
.rec-b{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;text-align:left;color:var(--ink);cursor:pointer}
.rec-t{flex:1;min-width:0;display:grid;gap:2px}.rec-t b{font-size:15px;font-weight:600}.rec-t small{font-size:11.5px;color:var(--muted)}
.rec-b .chev{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.6}

/* v100: 長押しメニュー */
li.item .row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
li.item.lp-on{transform:scale(.985);transition:transform .15s;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent);border-radius:14px}
.lpm{position:fixed;z-index:45;padding:8px;border-radius:18px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);box-shadow:0 16px 40px rgba(0,0,0,.25);border:1px solid color-mix(in srgb,#fff 25%,transparent);display:grid;gap:2px;animation:tbIn .16s ease-out}
.lpm-t{font-size:11.5px;color:var(--muted);padding:4px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpm button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 8px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
.lpm button:active{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.lpm button:disabled{opacity:.5}
.lpm .lpm-x{justify-content:center;color:var(--muted);font-size:13px}
.lpm .ib{width:28px;height:28px}

/* v101: 入力欄のフォントを16px以上に（iPhoneの自動ズーム防止）・ダブルタップ拡大の防止 */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (-webkit-touch-callout:none){ input:not([type=checkbox]):not([type=radio]):not([type=color]),textarea,select{font-size:max(16px,1em)!important} }

/* v102 habits: day-of follow */
.wdp{display:flex;flex-wrap:wrap;gap:6px}
.wdp button{min-width:38px;height:38px;padding:0 8px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;touch-action:manipulation}
.wdp button.sun{color:var(--danger)} .wdp button.sat{color:#3b82f6}
.wdp button[aria-pressed="true"]{background:var(--kc,var(--habit));border-color:var(--kc,var(--habit));color:#fff}
.wdp.nth button{min-width:48px;font-size:13px}
.hnext{margin:4px 0 2px;font-weight:600;color:var(--kc,var(--habit))}
.htoday-card{margin-top:8px}
.htoday-card h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.htoday-card h3 small{font-weight:500;color:var(--muted);font-size:12px}
.htd-n{font-size:13px;color:var(--habit);font-weight:700}
.htd-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.htd{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:color-mix(in srgb,var(--habit) 10%,transparent);border:1px solid color-mix(in srgb,var(--habit) 30%,transparent)}
.htd .check{flex:none}
.htd .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.htd .tx b{font-size:15px;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.htd .hmissb{flex:none;font-size:11.5px;padding:6px 9px;white-space:nowrap}.htd-st{flex:none}
.htd .tx small{font-size:11.5px;color:var(--muted)}

let vaultCol=null; const vTimers={};
async function vaultUnlock(pin,silent){
  pin=(pin||"").trim(); if(pin.length<4){ if(!silent) toast("PINは4文字以上にしてください"); return false; }
  if(!vaultCol){ if(!silent) toast("共有データに接続できていません"); return false; }
  try{
    const m=state.vaultMeta;
    if(!m){ const salt=crypto.getRandomValues(new Uint8Array(16)); const key=await vDerive(pin,salt); const check=await vEnc(key,"ok");
      await vaultCol.doc("meta").set({salt:b64(salt),check,createdAt:Date.now()}); state.vaultMeta={salt:b64(salt),check}; state.vaultKey=key; }
    else { const key=await vDerive(pin,unb64(m.salt)); if(await vDec(key,m.check)!=="ok") throw 0; state.vaultKey=key; }
    store.set("futari.vpin",pin); /* remembered on this device when the browser keeps storage; otherwise asked again */
    await vaultDecryptAll(); if(!silent) toast("じぶん専用データの鍵を開きました"); render(); return true;
  }catch(e){ if(!silent) toast("PINが違います"); state.vaultKey=null; return false; }
}
async function vaultDecryptAll(){ if(!state.vaultKey) return; for(const [c,d] of Object.entries(state.vaultRaw||{})){ try{ state[c]=await vDec(state.vaultKey,d); }catch(e){} } }

  clearTimeout(vTimers[c]); vTimers[c]=setTimeout(async()=>{ try{ const d=await vEnc(state.vaultKey,state[c]); if(d.ct.length>240000){ toast("じぶん専用データが大きすぎます。古い記録を整理してください"); return; } await vaultCol.doc(c).set({...d,updatedAt:Date.now()}); }catch(e){ err(e); } },500);
}

/* 操作の感触：iPhoneは switch 付きチェックボックスの切替で端末の触覚が鳴る（iOS 18〜）。Androidは vibrate */
const HAPT={tick:[8],arm:[12],done:[18,40,18],del:[30],undo:[12,30,12],nav:[6],warn:[40,60,40]};
let lastHap=0;
function iosTap(){
  // iOS 18+ : スイッチ型チェックボックスを「ユーザー操作の中で同期的に」切り替えると本体が振動する
  try{ const l=document.createElement("label"); l.setAttribute("aria-hidden","true"); l.style.display="none";
    const inp=document.createElement("input"); inp.type="checkbox"; inp.setAttribute("switch",""); l.appendChild(inp);
    document.head.appendChild(l); l.click(); l.remove(); }catch(e){}
}
function iosTapB(){
  try{ let l=document.getElementById("hapSwB"); if(!l){ l=document.createElement("label"); l.id="hapSwB"; l.setAttribute("aria-hidden","true");
      l.style.cssText="position:fixed;right:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0.01;z-index:-1";
      const i=document.createElement("input"); i.type="checkbox"; i.setAttribute("switch",""); i.tabIndex=-1; l.appendChild(i); document.body.appendChild(l); }
    l.querySelector("input").click(); }catch(e){}
}
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function hapticWay(){ return prefs.hapWay||"A"; }
function haptic(k="tick"){
  if(prefs.haptic==="off") return; const now=Date.now(); if(now-lastHap<35) return; lastHap=now;
  const pat=HAPT[k]||HAPT.tick;
  const f=hapticWay()==="B"?iosTapB:iosTap; f();  // iPhone：振動APIの有無に関わらず必ず鳴らす
  try{ if(navigator.vibrate) navigator.vibrate(prefs.haptic==="light"?pat.map((v,i)=>i%2?v:Math.ceil(v/2)):pat); }catch(e){}
  if(IS_IOS) { window.__hapN=(window.__hapN||0)+1; }
  if(prefs.haptic!=="light") for(let i=1;i<Math.ceil(pat.length/2);i++) setTimeout(f,i*90);
}
// タップした瞬間（ユーザー操作の最中）に必ず1回鳴らす。非同期処理のあとで呼ばれる haptic() は iOS では鳴らないため
document.addEventListener("click",e=>{
  if(prefs.haptic==="off"||e.target.closest("input,textarea,select,[contenteditable],[data-act^=hapTest]")) return; const lb=e.target.closest("label"); if(lb&&lb.querySelector("input[switch]")) return;
  if(e.target.closest("button,a,label,[data-act],[data-tab],[data-v],[data-pref],[data-tip],[data-dg],[data-toff],.rtab,.chk,[role=button],[onclick]")) haptic("tick");
},true);
let toastTimer=null,undoFn=null,toastLeft=0,toastT0=0;
const TOAST_MS=5000, UNDO_MS=7000;
function toastHide(){ $("toast").hidden=true; undoFn=null; clearTimeout(toastTimer); }
function toastArm(ms){ clearTimeout(toastTimer); toastLeft=ms; toastT0=Date.now(); toastTimer=setTimeout(toastHide,ms); }
let toastSeq=0;
function toast(msg,undo,kind){ toastSeq++;
  const t=$("toast"); $("toastMsg").textContent=msg; undoFn=undo||null; $("toastUndo").hidden=!undo;
  t.className="toast"+(undo?" undo":kind==="ok"?" ok":""); $("toastIco").textContent=undo?(kind==="done"?"✓":"🗑"):kind==="ok"?"↺":"";
  t.style.setProperty("--tdur",UNDO_MS+"ms"); t.hidden=true; void t.offsetWidth; t.hidden=false;
  toastArm(undo?UNDO_MS:TOAST_MS);
}
/* 元に戻す確認ポップアップ：押している間は時間が止まる */
$("toast").addEventListener("pointerdown",()=>{ if(!undoFn) return; clearTimeout(toastTimer); toastLeft=Math.max(1500,toastLeft-(Date.now()-toastT0)); $("toast").classList.add("paused"); });
$("toast").addEventListener("pointerup",()=>{ if(!undoFn||$("toast").hidden) return; $("toast").classList.remove("paused"); toastArm(toastLeft); });
$("toastUndo").onclick=()=>{ const f=undoFn; undoFn=null; if(f){ f(); haptic("undo"); toast("元に戻しました",null,"ok"); } else toastHide(); };

function gcalUrl(i){
  i={...i,time:myT(i)}; const s=i.due.replace(/-/g,""); let dates;
  if(i.time){ const [h,m]=i.time.split(":").map(Number); const e=new Date(parse(i.due)); e.setHours(h+1,m);
    dates=`${s}T${i.time.replace(":","")}00/${ymd(e).replace(/-/g,"")}T${String(e.getHours()).padStart(2,"0")}${String(e.getMinutes()).padStart(2,"0")}00`; }
  else dates=`${s}/${addDays(i.due,1).replace(/-/g,"")}`;
  const title=(i.list==="shop"?"買い物: ":"")+i.text;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}&ctz=Asia%2FTokyo&details=${encodeURIComponent("ふたりのリストから追加")}`;

function annivInfo(p){
  if(!p.date) return null; const [y,m,d]=p.date.split("-").map(Number); const t=parse(today());
  let occ=new Date(t.getFullYear(),m-1,d); if(occ<t) occ=new Date(t.getFullYear()+1,m-1,d);
  const days=Math.round((occ-t)/864e5);
  return {occ:ymd(occ),days,years:occ.getFullYear()-y,cycle:String(days<=30?occ.getFullYear():occ.getFullYear()-1)};
}
function planDone(p){ if(p.cat==="anniv"){ const a=annivInfo(p); return !!(a&&p.celebrated===a.cycle); } return !!p.done; }
function planSoon(p){ return p.cat!=="anniv"&&p.date&&!p.done&&p.date<=addDays(today(),30); }

const yen=n=>"¥"+Number(n).toLocaleString("ja-JP");
function checksHTML(x){

}
function planMeta(p,showCat){

  else if(p.date){ const over=!p.done&&p.date<today(); bits.push(`<span class="due ${over?"over":p.date===today()?"today":""}">${p.cat==="bousai"?"期限 ":""}${dayLabel(p.date)}${over?" 過ぎています":""}</span>`); }

const tmin=s=>{ const [h,m]=(s||"0:0").split(":").map(Number); return h*60+(m||0); };
const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
function dayEntries(date){
  const out=[];

  const mine=x=>["both",myRole()].includes(getWho(x));

  for(const i of state.pitems) if(i.due===date&&i.time) out.push({kind:"i",c:"pitems",x:i,done:!!i.done,s:tmin(i.time),e:tmin(i.time)+(i.dur||30),t:i.text,col:i.list==="shop"?"shop":"task"});
  for(const c of state.chores||[]) if(myT(c)&&choreMine(c)&&choreOn(c,date)) out.push({kind:"i",c:"chores",x:c,done:!!(c.log||{})[date],s:tmin(myT(c)),e:tmin(myT(c))+(myD(c)||30),t:c.text,col:"future"});
  for(const h of recMine()) if(myT(h)&&recOn(h,date)) out.push({kind:"i",c:recColl(h),x:h,done:!!habitLog(h)[date],s:tmin(myT(h)),e:tmin(myT(h))+(myD(h)||30),t:h.text,col:"task"});
  if(false) for(const g of (state.gEvents[date]||[])) if(!g.allDay) out.push({kind:"g",x:g,s:g.s,e:g.e,t:g.t,col:"muted"});
  out.sort((a,b)=>a.s-b.s||b.e-a.e);
  const lanes=[]; for(const o of out){ let k=0; while(lanes[k]!==undefined&&lanes[k]>o.s) k++; lanes[k]=o.e; o.lane=k; }
  for(const o of out){ o.lanes=1+Math.max(...out.filter(p=>p.s<o.e&&p.e>o.s).map(p=>p.lane)); }
  return out;
}

async function loadGoogleDay(date,force){

  if(!force&&state.gEvents[date]) return;
  state.gEvents[date]=state.gEvents[date]||[];
  try{
    const r=await state.mcp.callTool("Google Calendar","list_events",{startTime:`${date}T00:00:00+09:00`,endTime:`${addDays(date,1)}T00:00:00+09:00`,orderBy:"startTime",pageSize:100,timeZone:"Asia/Tokyo"});
    const ev=((r&&r.payload&&r.payload.events)||[]), mine=new Set(state.gsync.map(g=>g.eventId));
    const J=x=>{ const d=new Date(new Date(x).getTime()+9*3600e3); return {day:d.toISOString().slice(0,10),m:d.getUTCHours()*60+d.getUTCMinutes()}; };
    state.gEvents[date]=ev.filter(e=>e.status!=="cancelled"&&!mine.has(e.id)&&e.start&&(e.start.dateTime||e.start.date)).map(e=>{
      const base={id:e.id,t:e.summary||"(予定)",loc:e.location||"",link:e.htmlLink||"",rec:!!e.recurringEventId};
      if(!e.start.dateTime) return {...base,allDay:true,s:0,e:0};
      const st=J(e.start.dateTime), en=J(e.end.dateTime);
      const sd=st.day===date?st.m:0, ed=en.day===date?en.m:24*60; return {...base,s:sd,e:Math.max(ed,sd+15)}; });
    state.gErr="";
  }catch(e){ state.gErr=gErrText(e); }
  if(state.view==="cal") requestRender();
}
function gErrText(e){ const c=e&&e.code;
  return c==="server_not_connected"?"Googleカレンダー連携が未設定です（config.js の FUTARI_GAS_URL）"
   : c==="needs_reauth"?"Googleカレンダー連携の認証に失敗しました。いったんログアウトしてログインし直してください"
   : c==="not_in_manifest"||c==="not_granted"?"Googleカレンダーを使えません："+((e&&e.detail)||"")
   : c==="server_unavailable"?"Googleカレンダーに一時的につながりません。少し待ってからもう一度"
   : "Googleカレンダーとの通信に失敗しました（"+(c||"不明")+((e&&e.detail)?"："+e.detail:"")+"）"; }

function desiredEvents(){

    if(time){ const s=tmin(time), e=s+(dur||30); o.start=`${date}T${hhmm(s)}:00+09:00`; o.end=e>=1440?`${addDays(date,1)}T${hhmm(e-1440)}:00+09:00`:`${date}T${hhmm(e)}:00+09:00`; }
    else { o.start=`${date}T00:00:00+09:00`; o.end=`${addDays(date,1)}T00:00:00+09:00`; }
    out.push(o); };
  if(prefs.gsItems==="1") state.items.filter(i=>!myDone(i)&&inR(i.due)&&mine(i)).forEach(i=>ev("i:"+i.id,`${i.list==="shop"?"［買い物］":"［やること］"}${i.text}`,i.due,myT(i),myD(i)||30));

  if(prefs.gsItems==="1") state.plans.filter(p=>p.cat!=="anniv"&&!p.done&&inR(p.date)&&mine(p)).forEach(p=>ev("p:"+p.id,`［${PCATS[p.cat].label}］${p.text}`,p.date));
  if(prefs.gsPitems==="1") state.pitems.filter(i=>!i.done&&inR(i.due)).forEach(i=>ev("m:"+i.id,`${i.list==="shop"?"［買い物］":i.list==="wish"?"［やりたい］":"［タスク］"}${i.text}`,i.due,i.time,i.dur||30,"ふたりのリスト（じぶん）から同期"));

  if(prefs.gsShift==="1") for(let d=t;d<=to;d=addDays(d,1)){ const s=shiftOf(me,d); if(s) ev(`s:${d}`,`［シフト］${SHIFT_NAME[s]}`,d); }
  return out;
}

/* 単独アプリ版：開いている間は自動でGoogleカレンダーへ同期（変更がなければ通信は一覧の比較だけ） */
let gAutoAt=0;
function gAutoKick(delay){ return; /* v125: 同期は廃止 */ clearTimeout(gAutoKick.t); gAutoKick.t=setTimeout(()=>{
  if(prefs.gAuto!=="1"||!state.mcp||state.gsBusy||document.hidden||!state.me||!state.blocksLoaded||!state.gsyncLoaded) return;
  if(Date.now()-gAutoAt<15e3){ gAutoKick(15e3); return; } gAutoAt=Date.now(); gsyncRun().catch(()=>{}); },delay??1500); }
setInterval(()=>gAutoKick(0),5*60e3);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) gAutoKick(3000); });
const gKey=k=>k.replace(/[^A-Za-z0-9_\-.~:@+]/g,"_");
async function gsyncRun(){
  if(!state.mcp){ state.gsMsg="Googleカレンダー連携が未設定です（config.js の FUTARI_GAS_URL にApps ScriptのURLを入れてください）"; requestRender(); return; }
  if(state.gsBusy) return;
  const want=desiredEvents(), have=new Map(state.gsync.map(g=>[g.id,g])), wantKeys=new Set(want.map(w=>gKey(w.key)));
  const t=today(), jobs=[];
  for(const w of want){ const id=gKey(w.key), h=JSON.stringify([w.summary,w.start,w.end,w.allDay]), g=have.get(id);
    if(!g) jobs.push({op:"create",id,w,h}); else if(g.hash!==h) jobs.push({op:"update",id,w,h,eventId:g.eventId}); }
  for(const [id,g] of have) if(!wantKeys.has(id)&&(g.date||"9")>=addDays(t,-1)) jobs.push({op:"delete",id,eventId:g.eventId});
  if(!jobs.length){ state.gsMsg="変更はありません。"; prefs.gLast=new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); savePrefs(true); requestRender(); return; }
  let ok=0,ng=0,lastErr=null;
  for(let k=0;k<jobs.length;k++){ const j=jobs[k]; state.gsBusy=`同期中 ${k+1}/${jobs.length}`; const el=$("gsState"); if(el) el.textContent=state.gsBusy;
    try{
      if(j.op==="delete"){ try{ await state.mcp.callTool("Google Calendar","delete_event",{eventId:j.eventId,notificationLevel:"NONE"}); }catch(e){ if(e&&e.code!=="tool_error") throw e; } await ddel("gsync",j.id); }
      else { const body={summary:j.w.summary,startTime:j.w.start,endTime:j.w.end,allDay:j.w.allDay,description:j.w.description,timeZone:"Asia/Tokyo",notificationLevel:"NONE"};
        let eventId=j.eventId;
        if(j.op==="update"){ try{ await state.mcp.callTool("Google Calendar","update_event",{eventId,...body}); }catch(e){ if(e&&e.code==="tool_error") eventId=null; else throw e; } }
        if(j.op==="create"||!eventId){ const r=await state.mcp.callTool("Google Calendar","create_event",body); const p=(r&&r.payload)||{}; eventId=p.id||(p.event&&p.event.id)||p.eventId||null; if(!eventId) throw {code:"tool_error",message:"イベントIDを取得できませんでした"}; }
        await dset("gsync",j.id,{eventId,hash:j.h,date:j.w.date,updatedAt:Date.now()}); }
      ok++;
    }catch(e){ ng++; lastErr=e; if(e&&["server_not_connected","needs_reauth","not_in_manifest","not_granted","blocked_by_policy","capability_disabled"].includes(e.code)) break; }
  }
  state.gsBusy=""; state.gsMsg=ng?`${ok}件を反映、${ng}件は失敗：${gErrText(lastErr)}`:`${ok}件をGoogleカレンダーに反映しました。`;
  prefs.gLast=new Date().toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); savePrefs(true);
  state.gEvents={}; requestRender(); if(state.view==="cal") loadGoogleDay(state.sel,true);
}

function goCheck(k){
  const t=today();
  if(k==="talk"){ const m=talkMissing(); state.talkDate=m.length?m[m.length-1]:t; go("talk"); }
  else if(k==="caution") go("caution");
  else if(k==="comment"){ state.diaryTab="me"; go("diary"); }
  else if(k==="diary"||k==="thanks"||k==="dinner"){ state.diaryTab="me"; state.diaryDate=t; go("diary"); if(k!=="diary") setTimeout(()=>{ const el=$(k==="thanks"?"thxIn":"dinIn"); if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); el.focus({preventScroll:true}); } },120); }
  else if(k==="reflect"){ state.refDate=t; go("reflect"); }
  else if(k==="habit"||k==="hdue") go("habit");
  else if(k==="qa"){ go("home"); setTimeout(()=>{ const el=document.querySelector(".qa.hq"); if(el){ el.scrollIntoView({block:"center",behavior:"smooth"}); const i=$("qaIn"); if(i) i.focus({preventScroll:true}); } },120); }
  else if(k==="cprac") go("caution");
  else if(k==="shift"){ state.sel=t; state.calMonth=new Date(parse(t).getFullYear(),parse(t).getMonth(),1); state.paint.on=true; state.paint.who=myRole(); go("cal"); state.paint.on=true; render(); }
  else if(k==="trouble") go("trouble");
  else if(k==="overdue") go(state.items.some(i=>i.due&&!i.done&&i.due<t)?"task":"ptask");
  else if(k==="cgover"){ state.moneyTab="sum"; state.moneyP="month"; state.moneyRef=t; go("money"); }
  else if(k==="rpay"){ state.moneyTab="month"; state.moneyRef=t; go("money"); }
  else if(k==="limit"){ state.moneyTab="sum"; state.moneyP="month"; state.moneyRef=t; go("money"); }
  else if(k==="actual"){ state.moneyTab="sum"; state.moneyP="year"; state.moneyRef=t; go("money"); }
  else if(k==="bousai"){ state.fut="bousai"; go("future"); }
  else if(k==="bug") go("settings");
  else if(k==="task") go("task"); else if(k==="shop") go("shop"); else if(k==="chore") go("chore");
  else if(k==="evening"){ state.diaryTab="me"; state.diaryDate=t; go("diary"); }
  else if(k==="money"){ state.moneyTab="month"; state.moneyRef=t; go("money"); }
}

/* ================= ふたりのタスクは、それぞれが自分の時間を決められる ================= */
const sharedBoth=i=>!!i&&("who" in i)&&getWho(i)==="both";
const myT=i=>{ const k="time_"+myRole(); return sharedBoth(i)&&(k in i)?i[k]:i.time; };
const myD=i=>{ const k="dur_"+myRole(); return sharedBoth(i)&&(k in i)?i[k]:i.dur; };
const otT=i=>{ const k="time_"+otherRole(); return sharedBoth(i)&&(k in i)?i[k]:i.time; };
function timeCh(i,time,dur){ if(sharedBoth(i)){ const R=myRole(), O=otherRole(), o={["time_"+R]:time}; if(dur!=null) o["dur_"+R]=dur;
    /* 古い共通の時刻は、相手の分として残してから共通欄を空にする（以後は完全に別々） */
    if(i.time!=null&&i.time!==""&&!(("time_"+O) in i)){ o["time_"+O]=i.time; if(i.dur!=null&&!(("dur_"+O) in i)) o["dur_"+O]=i.dur; }
    if(i.time!=null&&i.time!==""){ if(dur==null&&i.dur!=null&&!(("dur_"+R) in i)) o["dur_"+R]=i.dur; o.time=null; o.dur=null; }
    return o; } const o={time}; if(dur!=null) o.dur=dur; return o; }
/* ふたりの「やること」は完了も別々：ふたりとも完了したら全体が完了 */
const bothTask=i=>sharedBoth(i)&&i.list==="task";
const doneOf=(i,r)=>!!i.done||!!i["done_"+r];
const myDone=i=>bothTask(i)?doneOf(i,myRole()):!!i.done;
function toggleMyDone(c,id){
  const x=state[c].find(i=>i.id===id); if(!x) return null;
  if(!(c==="items"&&bothTask(x))){ const ch=x.done?{done:false,doneAt:null,doneBy:null}:{done:true,doneAt:Date.now(),doneBy:myRole()}; dupd(c,id,ch); return ch; }
  const R=myRole(), O=otherRole(), mine=!doneOf(x,R), now=Date.now(), ch={};
  if(x.done&&!mine){ ch.done=false; ch.doneAt=null; ch["done_"+R]=false; ch["doneAt_"+R]=null; if(!(("done_"+O) in x)){ ch["done_"+O]=true; ch["doneAt_"+O]=x.doneAt||now; } }
  else { ch["done_"+R]=mine; ch["doneAt_"+R]=mine?now:null; const both=mine&&doneOf(x,O); ch.done=both; ch.doneAt=both?now:null; }
  dupd(c,id,ch); return ch;
}

 ["comm",/携帯|スマホ|通信|ネット|Wi-?Fi|wifi|サブスク|Netflix|プライム|Spotify|NHK|YouTube/i],

async function shrinkImage(file,max=1600,q=0.8){
  try{ let src; try{ src=await createImageBitmap(file); }catch(e){ src=await new Promise((ok,ng)=>{ const im=new Image(); im.onload=()=>ok(im); im.onerror=ng; im.src=URL.createObjectURL(file); }); }
    const w=src.width||src.naturalWidth, h=src.height||src.naturalHeight, k=Math.min(1,max/Math.max(w,h)), c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height); const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); return b||file; }catch(e){ return file; } }
async function savePhoto(file){ if(!state.assets||!file) return null; try{ const b=await shrinkImage(file); const r=await state.assets.upload(b,{type:"image/jpeg"}); state.assetUsage=null; return r.id; }catch(e){ toast(e&&e.code==="quota_or_state"?"写真の保存容量がいっぱいです。写真なしで登録しました":"写真を保存できませんでした。写真なしで登録しました"); return null; } }

function openPhoto(id){ const o=document.createElement("div"); o.className="lightbox"; o.innerHTML=`<img src="${photoUrl(id)}" alt="レシートの写真"><button aria-label="閉じる">✕</button>`; o.onclick=()=>o.remove(); document.body.appendChild(o); }
const photoRefs=()=>{ const s2=new Set(); for(const p of state.photos) if(p.kind&&p.kind!=="receipt") s2.add(p.id); for(const x of state.diary) for(const id of (x.photos||[])) s2.add(id); for(const x of state.priv) for(const id of (x.photos||[])) s2.add(id); for(const x of state.spend) if(x.photo) s2.add(x.photo); for(const c of ["items","pitems","plans"]) for(const x of state[c]) if(x.receipt&&x.receipt.photo) s2.add(x.receipt.photo); return s2; };

function monthsBack(n){ const t=parse(today()); return [...Array(n)].map((_,i)=>ymd(new Date(t.getFullYear(),t.getMonth()-(n-1-i),1)).slice(0,7)); }
function chartTip(label,val){ return `data-tip="${esc(label)}：${esc(val)}"`; }
function moneyTrendSVG(vals,labels,goal,colorOf){
  const W=320,H=150,pl=34,pb=20,pt=10, n=vals.length, mx=niceTop(Math.max(...vals,goal||0,1)), bw=(W-pl)/n, y=v=>pt+(H-pt-pb)*(1-v/mx);
  const k=mx>=10000?1000:1, fmt=v=>k>1?`${Math.round(v/1000)}千`:Math.round(v);
  const grid=[0,mx/2,mx].map(v=>`<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${pl-4}" y="${y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join("");
  const bars=vals.map((v,i)=>{ const x=pl+i*bw+bw*.16, w=bw*.68, top=y(v), hh=Math.max(0,H-pb-top), r=Math.min(4,hh), over=goal&&v>goal;
    return `<g class="tipg" ${chartTip(labels[i],yen(v)+(goal?`（目標${yen(goal)}）`:""))}><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>${v?`<path d="M${x},${H-pb} V${top+r} q0,-${r} ${r},-${r} h${w-2*r} q${r},0 ${r},${r} V${H-pb} Z" fill="${over?"var(--danger)":(colorOf?colorOf(i):"var(--accent)")}"/>`:""}</g>`; }).join("");
  const gl=goal?`<line x1="${pl}" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--ink)" stroke-dasharray="4 3" stroke-width="1.2"/><text class="ax" x="${W}" y="${y(goal)-4}" text-anchor="end">目標 ${fmt(goal)}</text>`:"";
  const step=n>8?2:1, xl=labels.map((l,i)=>i%step===(n-1)%step?`<text class="ax" x="${pl+i*bw+bw/2}" y="${H-5}" text-anchor="middle">${esc(l)}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="mchart" role="img">${grid}${bars}${gl}${xl}</svg>`;
}
function donutSVG(parts,total){
  const R=54,r=34,cx=70,cy=70; let a=-Math.PI/2; const segs=[];
  for(const p of parts){ const ang=p.v/total*Math.PI*2; if(ang<=0) continue; const gap=parts.length>1?0.03:0, a0=a+gap/2, a1=a+ang-gap/2, large=a1-a0>Math.PI?1:0;
    const P=(rad,rr)=>`${(cx+rr*Math.cos(rad)).toFixed(2)},${(cy+rr*Math.sin(rad)).toFixed(2)}`;
    segs.push(parts.length===1?`<g class="tipg" ${chartTip(p.l,yen(p.v))}><circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${p.c}" stroke-width="${R-r}"/></g>`
      :`<g class="tipg" ${chartTip(p.l,`${yen(p.v)}（${Math.round(p.v/total*100)}%）`)}><path d="M${P(a0,R)} A${R},${R} 0 ${large} 1 ${P(a1,R)} L${P(a1,r)} A${r},${r} 0 ${large} 0 ${P(a0,r)} Z" fill="${p.c}"/></g>`); a+=ang; }
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="分類の割合">${segs.join("")}<text x="70" y="66" text-anchor="middle" class="dn-l">合計</text><text x="70" y="84" text-anchor="middle" class="dn-v">${yen(total)}</text></svg>`;
}

const SVG_TAGS=new Set(["path","circle","ellipse","rect","line","polyline","polygon","g"]), SVG_ATTRS=new Set(["d","cx","cy","r","rx","ry","x","y","width","height","x1","y1","x2","y2","points","fill","stroke","stroke-width","stroke-linecap","stroke-linejoin","opacity","fill-opacity","stroke-opacity","transform","fill-rule"]);

        for(const a of c.attributes){ const n=a.name.toLowerCase(); let v=a.value; if(!SVG_ATTRS.has(n)) continue; if((n==="fill"||n==="stroke")&&!/^(none|#fff(fff)?|white|currentColor)$/i.test(v)) v="#fff"; if(/url\(|javascript|expression/i.test(v)) continue; at.push(`${n}="${v.replace(/"/g,"")}"`); }
        if(t==="g"){ out.push(`<g ${at.join(" ")}>`); walk(c,depth+1); out.push("</g>"); } else out.push(`<${t} ${at.join(" ")}/>`); } };
    walk(doc.documentElement,0); const r=out.join(""); return r.length>30&&r.length<6000?r:""; }catch(e){ return ""; } }

function jpHolidays(y){ const S=new Set(), f=(m,d)=>`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  [[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(([m,d])=>S.add(f(m,d)));
  S.add(f(1,nth(1,2))); S.add(f(7,nth(7,3))); S.add(f(9,nth(9,3))); S.add(f(10,nth(10,2)));
  const k=y-1980; S.add(f(3,Math.floor(20.8431+0.242194*k-Math.floor(k/4)))); S.add(f(9,Math.floor(23.2488+0.242194*k-Math.floor(k/4))));
  for(const d of [...S].sort()){ if(parse(d).getDay()===0){ let x=addDays(d,1); while(S.has(x)) x=addDays(x,1); S.add(x); } }
  for(const d of [...S]){ const x=addDays(d,2); if(S.has(x)&&!S.has(addDays(d,1))&&parse(addDays(d,1)).getDay()!==0) S.add(addDays(d,1)); }

async function shOcrRead(f){
  const O=state.shOcr; if(!O||!f) return; const r=O.role||state.paint.who||myRole(), ym=ymd(state.calMonth).slice(0,7), [y,m]=ym.split("-").map(Number), N=new Date(y,m,0).getDate();
  const name=O.name||"", leg=O.legend||"";
  state.shOcr={...O,role:r,st:"reading",err:"",url:URL.createObjectURL(f),ym}; render();
  const prompt=`これは職場の勤務表（シフト表）の写真です。${y}年${m}月の「${name||nameOf(r)}」さんの行（または列）を探し、1日〜${N}日の各日の勤務を、次の5つの記号のどれかに置き換えてください。
記号：入＝夜勤入り（夜勤の始まる日）、明＝夜勤明け、休＝休み（公休・有給・希望休・特休など）、早＝早番、日＝日勤（通常勤務）
${leg?`この勤務表での記号の意味：${leg}\n`:""}- 夜勤が2日にまたがる表記なら、始まる日を「入」、翌日を「明」にする
- 読めない日・空欄の日は含めない。推測で埋めない
- 別の人の行を読まないよう、名前をよく確かめる
次の形のJSONだけを返してください：
{"found":true,"name":"表で見つけた名前","days":{"1":"日","2":"休"},"note":"迷った点があれば短く（なければ空文字）"}`;
  try{
    const d=await state.sample.json(prompt,{images:f});
    const days={}; const src=d&&d.days&&typeof d.days==="object"?d.days:{}; const OK=new Set(SHIFTS.map(x=>x[0]));
    for(const [k,v] of Object.entries(src)){ const n=Number(String(k).replace(/\D/g,"")); if(n>=1&&n<=N&&OK.has(String(v).trim())) days[String(n)]=String(v).trim(); }

    state.shOcr={...state.shOcr,st:"ready",days,found:d.found!==false,note:String(d.note||"").slice(0,120)}; haptic("done"); render();
  }catch(e){ state.shOcr={...state.shOcr,st:"setup",err:e&&e.code==="rate_limited"?"AIの無料枠の回数制限です。少し時間をおいてください":e&&e.code==="no_key"?"GeminiのAPIキーが未設定です（Apps Scriptのスクリプト プロパティ）":`読み取りに失敗しました（${(e&&(e.detail||e.code||e.message))||"不明"}）`}; render(); }
}
