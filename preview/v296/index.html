<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ふたりすと・今日の実績 検証</title><style>body{margin:0;background:#e6ece9;color:#24372c;font:15px system-ui}header{text-align:center;padding:12px}button{padding:9px 15px;margin:4px;border:1px solid #9aac9f;border-radius:8px;background:white;color:#24372c}iframe{display:block;width:393px;max-width:100%;height:850px;margin:0 auto;border:1px solid #a1b7aa;border-radius:15px;background:white}p{margin:0 0 6px}</style><header><p>検証専用・すべて架空データ・本番への接続なし</p><button data-w="320">320px</button><button data-w="393">393px</button><button data-w="768">768px</button><button id="dark">ダーク表示</button></header><iframe title="ふたりすとの検証画面" src="app.html"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>f.style.width=b.dataset.w+'px');document.querySelector('#dark').onclick=()=>f.src=f.src.includes('theme=dark')?'app.html':'app.html?theme=dark';</script></html>
