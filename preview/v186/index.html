<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふたり v186 検証専用</title>
<style>body{margin:0;background:#e9eeeb;color:#173b31;font:15px system-ui}header{padding:10px 16px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0}p{margin:0;font-size:12px}button{padding:8px;border:1px solid #aac2b7;border-radius:8px;background:white;color:inherit}main{display:flex;justify-content:center;padding:12px}iframe{width:390px;max-width:100%;height:calc(100vh - 150px);min-height:580px;border:1px solid #afc1b9;border-radius:16px;background:white}</style>
<header><div><h1>v186 検証専用</h1><p>架空データ・本番接続なし。再読み込みで初期化。</p></div><button id="small">320px</button><button data-font="m">通常文字</button><button data-font="xl">大きい文字</button><button id="mobile">390px</button><button id="desktop">PC幅</button><button id="dark">ダーク</button><button data-view="settings">要望一覧</button><button data-view="cal">カレンダー</button><button data-view="home">ホーム・AI</button><button data-view="task">やること</button><button data-view="habit">習慣</button><button data-view="talk">話す・カレンダー</button><button data-view="diary">食材・献立</button><button data-role="h">テストA</button><button data-role="w">テストB</button><button data-ai="normal">AI通常</button><button data-ai="slow">AI遅延12秒</button><button data-ai="access">AI接続エラー</button><button data-ai="hang">AI無応答</button><button id="legacy">旧設定の同期</button></header>
<main><iframe id="app" title="検証用アプリ" src="app.html?view=requests" sandbox="allow-scripts allow-forms allow-downloads"></iframe></main>
<script>
const frame=document.getElementById('app');document.querySelectorAll('[data-ai]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({preview:186,aiMode:b.dataset.ai},'*'));document.getElementById('small').onclick=()=>frame.style.width='320px';document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({preview:186,fontSize:b.dataset.font},'*'));document.getElementById('mobile').onclick=()=>frame.style.width='390px';document.getElementById('desktop').onclick=()=>frame.style.width='100%';document.getElementById('dark').onclick=()=>frame.src='app.html?view=requests&theme=dark';
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({preview:186,view:b.dataset.view},'*'));document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>frame.contentWindow.postMessage({preview:186,role:b.dataset.role},'*'));document.getElementById('legacy').onclick=()=>frame.contentWindow.postMessage({preview:186,resetPrefs:true},'*');
</script></html>
